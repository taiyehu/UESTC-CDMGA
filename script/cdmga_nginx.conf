server {
    listen 80;  # 监听 80 端口

    server_name localhost;

    client_max_body_size 12M;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml application/rss+xml image/svg+xml;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location = /api/media/thumb {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Forwarded-Ssl "";
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=2592000";
    }

    location /api/ {
        add_header Cache-Control "no-store" always;
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header Forwarded "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Forwarded-Ssl "";

    }

    location ^~ /assets/ {
        root /var/www/CDMGA-vue/current_main;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        # 指向你的前端服务地址
        root /var/www/CDMGA-vue/current_main;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;

    }
    include /etc/nginx/snippets/cdmga_assets.conf;

    # 您可以添加访问日志和错误日志的路径
    access_log /var/log/nginx/cdmga.access.log;
    error_log /var/log/nginx/cdmga.error.log;
}
