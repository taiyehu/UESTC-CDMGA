# 配置开发环境下允许跨域的前端服务器地址
cors.allowed-origins=http://localhost:8081,http://localhost:5174
server.servlet.session.cookie.secure=true
sign.qr-secret=${SIGN_QR_SECRET:}

# 本地上传文件放在用户目录；设置 CDMGA_UPLOAD_ROOT 可覆盖根目录。
course.upload.directory=${CDMGA_UPLOAD_ROOT:${user.home}/.local/share/cdmga/uploads}/images/
score.upload.directory=${CDMGA_UPLOAD_ROOT:${user.home}/.local/share/cdmga/uploads}/scores/
avatar.upload.directory=${CDMGA_UPLOAD_ROOT:${user.home}/.local/share/cdmga/uploads}/avatars/
activity.upload.banner-directory=${CDMGA_UPLOAD_ROOT:${user.home}/.local/share/cdmga/uploads}/banners/
activity.upload.file-directory=${CDMGA_UPLOAD_ROOT:${user.home}/.local/share/cdmga/uploads}/files/
forum.upload.directory=${CDMGA_UPLOAD_ROOT:${user.home}/.local/share/cdmga/uploads}/forum/
