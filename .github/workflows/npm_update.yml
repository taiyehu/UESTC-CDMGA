name: frontend-deploy-legacy-entry

on:
  workflow_call:
    secrets:
      SSH_HOST: {}
      SSH_SUDO: {}
      SSH_PRIVATE_KEY: {}
      SSH_PORT: {}
  workflow_dispatch:

jobs:
  deploy:
    uses: ./.github/workflows/pnpm_update.yml
    with:
      channel: main
    secrets:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_SUDO: ${{ secrets.SSH_SUDO }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
