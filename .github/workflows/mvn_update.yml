name: mvn-update
on:
  workflow_call:
    secrets:
      SSH_HOST: {}
      SSH_SUDO: {}
      SSH_PRIVATE_KEY: {}
      SSH_PORT: {}
  workflow_dispatch:

jobs:
  mvn-build:
    # if: |
    #   github.event_name == 'workflow_dispatch' ||
    #   github.event_name == 'push' 
    name: mvn build
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: webpage
    steps:
    - uses: actions/checkout@v7
    
    - name: Set up JDK
      uses: actions/setup-java@v3
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: 'maven'
    
    - name: Build with Maven
      run: mvn clean package -P prod
      
    - name: List JAR file
      run: ls -la target/*.jar

    - name: Upload JAR to ECS relay
      uses: appleboy/scp-action@v1.0.0
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_SUDO }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.SSH_PORT || 22 }}
        source: "webpage/target/*.jar"
        target: "/opt/webserver/upload/"
        strip_components: 2

    - name: Deploy Java to Tailscale computer
      uses: appleboy/ssh-action@v1.2.5
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_SUDO }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.SSH_PORT || 22 }}
        script: |
          set -e
          jar=/opt/webserver/upload/webpage-0.0.1-SNAPSHOT.jar
          test -s "$jar"
          test -s /home/webadmin/.ssh/cdmga_pc_deploy_ed25519
          ssh -T -i /home/webadmin/.ssh/cdmga_pc_deploy_ed25519 \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            eighteen-wang@100.81.22.111 < "$jar"
          rm -f "$jar"
          curl -fsS -o /dev/null --max-time 10 \
            'http://100.81.22.111:18080/api/activity/list?size=1'
