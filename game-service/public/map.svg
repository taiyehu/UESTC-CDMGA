  <marker id="arr-bank" markerWidth="24" markerHeight="24" refX="12" refY="12" orient="auto" markerUnits="userSpaceOnUse"><path d="M 2 2 L 22 12 L 2 22 Z" fill="#189b87" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></marker>
  <marker id="arr-ph" markerWidth="24" markerHeight="24" refX="12" refY="12" orient="auto" markerUnits="userSpaceOnUse"><path d="M 2 2 L 22 12 L 2 22 Z" fill="#c87927" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></marker>
  <marker id="arr-fan" markerWidth="24" markerHeight="24" refX="12" refY="12" orient="auto" markerUnits="userSpaceOnUse"><path d="M 2 2 L 22 12 L 2 22 Z" fill="#8c5ac8" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></marker>
