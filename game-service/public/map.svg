<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="1510" viewBox="0 0 1640 1510" role="img" aria-labelledby="title desc">
<title id="title">圆环地图</title>
<desc id="desc">中央十二节点大环，R8位于正上方，R2位于正下方。R2与R8通过厄运B连接。三个外侧路线分别经过Arcaea银行、Phigros市场和范式起源藏宝阁，其中F2直接连接R10。箭头表示可移动方向。加号是收入格，减号是收税格，感叹号是事件格，斜杠是空白格。节点名称对照见node-types.csv。</desc>
<defs>
